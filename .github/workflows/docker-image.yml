name: Docker Image CI
on:
    push:
    workflow_dispatch:

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install dependencies
              run: npm ci --force
            - name: Lint code
              run: npm run lint
            - name: Check code style
              run: npm run prettier
