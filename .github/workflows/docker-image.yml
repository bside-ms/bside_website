name: CI

on:
    push:
    workflow_dispatch:

env:
    IMAGE_NAME: bsidems/bside-website

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install dependencies
              run: npm ci --force
            - name: Lint code
              run: npm run lint
            - name: Check code style
              run: npm run prettier

    build:
        name: Build and push image
        needs: lint
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Check required secrets and variables
              env:
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
                  PAYLOAD_URL: ${{ vars.PAYLOAD_URL }}
                  FRONTEND_URL: ${{ vars.FRONTEND_URL }}
                  TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
                  MATOMO_SITE_ID: ${{ vars.MATOMO_SITE_ID }}
                  MATOMO_ENDPOINT: ${{ vars.MATOMO_ENDPOINT }}
              run: |
                  missing=0
                  if [ -z "${DOCKERHUB_TOKEN}" ]; then
                    echo "Missing repository secret: DOCKERHUB_TOKEN"
                    missing=1
                  fi
                  for name in PAYLOAD_URL FRONTEND_URL TURNSTILE_SITE_KEY MATOMO_SITE_ID MATOMO_ENDPOINT; do
                    if [ -z "${!name}" ]; then
                      echo "Missing repository variable: ${name}"
                      missing=1
                    fi
                  done
                  exit "${missing}"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: bsidems
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  platforms: linux/amd64
                  tags: |
                      ${{ env.IMAGE_NAME }}:latest
                      ${{ env.IMAGE_NAME }}:${{ github.sha }}
                  build-args: |
                      PAYLOAD_URL=${{ vars.PAYLOAD_URL }}
                      FRONTEND_URL=${{ vars.FRONTEND_URL }}
                      TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
                      MATOMO_SITE_ID=${{ vars.MATOMO_SITE_ID }}
                      MATOMO_ENDPOINT=${{ vars.MATOMO_ENDPOINT }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
